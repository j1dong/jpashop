spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/jpashop
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create #애플리케이션 실행 시점에 엔티티가 정보를 보고 기존의 테이블을 다 지우고 다시 생성함
    properties:
      hibernate:
#        show_sql: true -> System.out에 하이버네이트 실행 SQL을 남김
        format_sql: true

logging.level:
  org.hibernate.SQL: debug #logger을 통해 하이버네이트 실행 SQL을 남김
  org.hibernate.orm.jdbc.bind: trace